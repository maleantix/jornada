<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkFlow Pro - Orange</title>
  
  <!-- Tailwind CSS para el diseño premium -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React y ReactDOM desde CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel para compilar JSX en vivo en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Estilos de animación personalizados -->
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
    .animate-scaleUp { animation: scaleUp 0.2s ease-out forwards; }
  </style>
</head>
<body>

  <!-- Contenedor donde React renderizará la aplicación -->
  <div id="root"></div>

  <!-- CÓDIGO DE LA APLICACIÓN REACT -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // === ICONOS SVG PERSONALIZADOS ===
    const ClockIcon = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const HomeIcon = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
    );

    const CalendarIcon = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
    );

    const PalmTreeIcon = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707.707M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const CoffeeIcon = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
      </svg>
    );

    const SettingsIcon = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    );

    const TrashIcon = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    );

    const ChartIcon = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M11 3.055A9.003 9.003 0 1020.945 13H11V3.055z" />
        <path strokeLinecap="round" strokeLinejoin="round" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" />
      </svg>
    );

    const CloudIcon = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
      </svg>
    );

    const LogoutIcon = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
    );

    const KeyIcon = () => (
      <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
    );

    function App() {
      // === ESTADO DE AUTENTICACIÓN ===
      const [isLoggedIn, setIsLoggedIn] = useState(() => {
        return sessionStorage.getItem('workflow_is_logged_in') === 'true';
      });

      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      // === DATOS DE LA APLICACIÓN ===
      const [shifts, setShifts] = useState(() => {
        const saved = localStorage.getItem('work_schedule_shifts_v2');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { console.error(e); }
        }
        
        // Datos demo iniciales para Mayo 2026 basados en el Excel del usuario
        return {
          '2026-05-01': { type: 'holiday', notes: 'Día del Trabajador (Festivo Nacional)' },
          '2026-05-04': { type: 'work', startTime: '08:00', endTime: '16:00', breakMinutes: 45, teletrabajo: false, flexHours: 0, notes: 'Turno de mañana' },
          '2026-05-05': { type: 'work', startTime: '08:00', endTime: '16:00', breakMinutes: 45, teletrabajo: true, flexHours: 1, notes: 'Plan Flex (+1 hora recuperada)' },
          '2026-05-06': { type: 'work', startTime: '08:00', endTime: '16:00', breakMinutes: 45, teletrabajo: true, flexHours: 0, notes: 'Enfoque técnico' },
          '2026-05-07': { type: 'work', startTime: '08:00', endTime: '16:00', breakMinutes: 45, teletrabajo: false, flexHours: 0, notes: 'Presencial' },
          '2026-05-08': { type: 'work', startTime: '08:00', endTime: '15:00', breakMinutes: 45, teletrabajo: true, flexHours: -1, notes: 'Plan Flex (-1 hora, salida temprana)' },
          '2026-05-11': { type: 'work', startTime: '08:00', endTime: '16:00', breakMinutes: 45, teletrabajo: true, flexHours: 0, notes: 'Semana de mañana' },
          '2026-05-12': { type: 'work', startTime: '08:00', endTime: '16:00', breakMinutes: 45, teletrabajo: false, flexHours: 0, notes: 'Oficina' },
          '2026-05-15': { type: 'holiday', notes: 'San Isidro (Festivo local Madrid)' },
          '2026-05-18': { type: 'work', startTime: '08:00', endTime: '16:00', breakMinutes: 45, teletrabajo: true, flexHours: 0, notes: 'Inicio de semana de mañana' },
          '2026-05-19': { type: 'work', startTime: '08:00', endTime: '16:00', breakMinutes: 45, teletrabajo: false, flexHours: 0, notes: 'Día de hoy - Presencial' },
          '2026-05-20': { type: 'vacation', notes: 'Día de vacaciones pedido' },
          '2026-05-25': { type: 'work', startTime: '09:00', endTime: '18:00', breakMinutes: 60, teletrabajo: true, flexHours: 0, notes: 'Comienza turno de tarde' }
        };
      });

      const [googleSheetsUrl, setGoogleSheetsUrl] = useState(() => {
        return localStorage.getItem('work_schedule_sheets_url') || '';
      });

      // Credenciales locales / sincronización
      const [sheetUser, setSheetUser] = useState(() => {
        return localStorage.getItem('work_schedule_sheet_user') || 'admin';
      });
      const [sheetPassword, setSheetPassword] = useState(() => {
        return localStorage.getItem('work_schedule_sheet_password') || 'admin123';
      });

      const [targetHours, setTargetHours] = useState(() => {
        const saved = localStorage.getItem('work_schedule_target_v2');
        return saved ? parseInt(saved, 10) : 152;
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [currentDate, setCurrentDate] = useState(new Date(2026, 4, 19)); // Forzado a Mayo de 2026 por defecto
      const [selectedDateStr, setSelectedDateStr] = useState('');
      
      const [isEditing, setIsEditing] = useState(false);
      const [editForm, setEditForm] = useState({
        type: 'work',
        startTime: '08:00',
        endTime: '16:00',
        breakMinutes: 45,
        teletrabajo: false,
        flexHours: 0,
        notes: ''
      });

      // Modales de confirmación
      const [showResetConfirm, setShowResetConfirm] = useState(false);
      const [notification, setNotification] = useState('');
      const [syncLoading, setSyncLoading] = useState(false);

      // Listas para selectores de fecha en cabecera
      const monthsList = [
        { value: 0, label: 'Enero' },
        { value: 1, label: 'Febrero' },
        { value: 2, label: 'Marzo' },
        { value: 3, label: 'Abril' },
        { value: 4, label: 'Mayo' },
        { value: 5, label: 'Junio' },
        { value: 6, label: 'Julio' },
        { value: 7, label: 'Agosto' },
        { value: 8, label: 'Septiembre' },
        { value: 9, label: 'Octubre' },
        { value: 10, label: 'Noviembre' },
        { value: 11, label: 'Diciembre' }
      ];

      // Generar 16 años (desde 2020 hasta 2035) para cumplir con "al menos unos 10 años"
      const yearsList = [];
      for (let y = 2020; y <= 2035; y++) {
        yearsList.push(y);
      }

      useEffect(() => {
        localStorage.setItem('work_schedule_shifts_v2', JSON.stringify(shifts));
      }, [shifts]);

      useEffect(() => {
        localStorage.setItem('work_schedule_sheets_url', googleSheetsUrl);
      }, [googleSheetsUrl]);

      useEffect(() => {
        localStorage.setItem('work_schedule_sheet_user', sheetUser);
      }, [sheetUser]);

      useEffect(() => {
        localStorage.setItem('work_schedule_sheet_password', sheetPassword);
      }, [sheetPassword]);

      useEffect(() => {
        localStorage.setItem('work_schedule_target_v2', targetHours.toString());
      }, [targetHours]);

      const showToast = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(''), 4000);
      };

      // === GESTIÓN DE ACCESO (LOGIN / LOGOUT) ===
      const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (loginUser.trim() === sheetUser.trim() && loginPass.trim() === sheetPassword.trim()) {
          setIsLoggedIn(true);
          sessionStorage.setItem('workflow_is_logged_in', 'true');
          setLoginError('');
          showToast('Sesión iniciada con éxito. ¡Bienvenido de nuevo!');
        } else {
          setLoginError('Usuario o contraseña incorrectos. Verifica tus credenciales.');
        }
      };

      const handleQuickDemoAccess = () => {
        setLoginUser(sheetUser);
        setLoginPass(sheetPassword);
        setIsLoggedIn(true);
        sessionStorage.setItem('workflow_is_logged_in', 'true');
        setLoginError('');
        showToast('Acceso de demostración concedido.');
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        sessionStorage.setItem('workflow_is_logged_in', 'false');
        setLoginUser('');
        setLoginPass('');
        showToast('Sesión cerrada correctamente.');
      };

      // === MANIPULACIÓN DE FECHAS ===
      const handleMonthSelect = (e) => {
        const newMonth = parseInt(e.target.value, 10);
        setCurrentDate(new Date(currentDate.getFullYear(), newMonth, 1));
      };

      const handleYearSelect = (e) => {
        const newYear = parseInt(e.target.value, 10);
        setCurrentDate(new Date(newYear, currentDate.getMonth(), 1));
      };

      const handlePrevMonth = () => {
        setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
      };

      const handleNextMonth = () => {
        setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
      };

      const handleGoToToday = () => {
        // Regresa a Mayo de 2026 (mes del anclaje y del contexto)
        setCurrentDate(new Date(2026, 4, 19));
        showToast('Regresaste a Mayo de 2026.');
      };

      // === ALGORITMO DE ROTACIÓN DE TURNOS (3 semanas) ===
      const getPredictedShiftForDate = (date) => {
        const targetDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const dayOfWeek = targetDate.getDay(); 
        const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
        const mondayOfTargetWeek = new Date(targetDate.setDate(targetDate.getDate() + diffToMonday));

        // Lunes de anclaje (Semana 1 del Turno A): 11 de Mayo de 2026
        const anchorMonday = new Date(2026, 4, 11);

        const diffTime = mondayOfTargetWeek.getTime() - anchorMonday.getTime();
        const diffWeeks = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 7));

        let cycleIndex = diffWeeks % 3;
        if (cycleIndex < 0) cycleIndex += 3; 
        
        if (cycleIndex === 2) {
          return { startTime: '09:00', endTime: '18:00', breakMinutes: 60, name: 'Turno Tarde (09:00 - 18:00)' };
        } else {
          return { startTime: '08:00', endTime: '16:00', breakMinutes: 45, name: `Turno Mañana (Semana ${cycleIndex + 1}/2)` };
        }
      };

      const calculateHours = (start, end, breakMins) => {
        if (!start || !end) return 0;
        const [startH, startM] = start.split(':').map(Number);
        const [endH, endM] = end.split(':').map(Number);
        
        let diffMinutes = (endH * 60 + endM) - (startH * 60 + startM);
        if (diffMinutes < 0) diffMinutes += 24 * 60;
        
        const activeMinutes = diffMinutes - (breakMins || 0);
        return Math.max(0, parseFloat((activeMinutes / 60).toFixed(2)));
      };

      const formatFriendlyDate = (dateStr) => {
        if (!dateStr) return '';
        const [y, m, d] = dateStr.split('-').map(Number);
        const date = new Date(y, m - 1, d);
        return date.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      };

      const getMonthStats = () => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        let totalWorkHours = 0;
        let workDaysCount = 0;
        let teleworkDays = 0;
        let officeDays = 0;
        let vacationDays = 0;
        let restDays = 0;
        let holidayDays = 0;
        let compensatoryDays = 0;
        let totalFlexBalance = 0; 

        Object.entries(shifts).forEach(([dateStr, data]) => {
          const [y, m, d] = dateStr.split('-').map(Number);
          if (y === year && (m - 1) === month) {
            if (data.type === 'work') {
              workDaysCount++;
              const baseHours = calculateHours(data.startTime, data.endTime, data.breakMinutes);
              totalWorkHours += baseHours;
              totalFlexBalance += (data.flexHours || 0);
              
              if (data.teletrabajo) teleworkDays++;
              else officeDays++;
            } else if (data.type === 'vacation') {
              vacationDays++;
            } else if (data.type === 'rest') {
              restDays++;
            } else if (data.type === 'holiday') {
              holidayDays++;
            } else if (data.type === 'compensatory') {
              compensatoryDays++;
            }
          }
        });

        return {
          totalWorkHours,
          workDaysCount,
          teleworkDays,
          officeDays,
          vacationDays,
          restDays,
          holidayDays,
          compensatoryDays,
          totalFlexBalance
        };
      };

      const stats = getMonthStats();

      const handleOpenEdit = (dateStr) => {
        setSelectedDateStr(dateStr);
        const [y, m, d] = dateStr.split('-').map(Number);
        const dateObj = new Date(y, m - 1, d);
        const predicted = getPredictedShiftForDate(dateObj);

        const existing = shifts[dateStr];
        if (existing) {
          setEditForm({
            type: existing.type || 'work',
            startTime: existing.startTime || predicted.startTime,
            endTime: existing.endTime || predicted.endTime,
            breakMinutes: existing.breakMinutes !== undefined ? existing.breakMinutes : predicted.breakMinutes,
            teletrabajo: !!existing.teletrabajo,
            flexHours: existing.flexHours || 0,
            notes: existing.notes || ''
          });
        } else {
          setEditForm({
            type: 'work',
            startTime: predicted.startTime,
            endTime: predicted.endTime,
            breakMinutes: predicted.breakMinutes,
            teletrabajo: false,
            flexHours: 0,
            notes: `Turno sugerido: ${predicted.name}`
          });
        }
        setIsEditing(true);
      };

      const handleSaveDay = (e) => {
        e.preventDefault();
        const updated = { ...shifts };
        updated[selectedDateStr] = {
          type: editForm.type,
          notes: editForm.notes,
          ...(editForm.type === 'work' ? {
            startTime: editForm.startTime,
            endTime: editForm.endTime,
            breakMinutes: Number(editForm.breakMinutes),
            teletrabajo: editForm.teletrabajo,
            flexHours: Number(editForm.flexHours)
          } : {})
        };
        setShifts(updated);
        setIsEditing(false);
        showToast(`Día ${selectedDateStr} guardado con éxito.`);
      };

      const handleDeleteDay = (dateStr) => {
        const updated = { ...shifts };
        delete updated[dateStr];
        setShifts(updated);
        if (isEditing && selectedDateStr === dateStr) {
          setIsEditing(false);
        }
        showToast(`Registro de ${dateStr} eliminado.`);
      };

      const handleQuickLogRotationToday = (dateObj) => {
        const yStr = dateObj.getFullYear();
        const mStr = String(dateObj.getMonth() + 1).padStart(2, '0');
        const dStr = String(dateObj.getDate()).padStart(2, '0');
        const dateKey = `${yStr}-${mStr}-${dStr}`;

        const predicted = getPredictedShiftForDate(dateObj);
        const updated = { ...shifts };
        updated[dateKey] = {
          type: 'work',
          startTime: predicted.startTime,
          endTime: predicted.endTime,
          breakMinutes: Math.max(0, predicted.breakMinutes),
          teletrabajo: false,
          flexHours: 0,
          notes: `Confirmación rápida: ${predicted.name}`
        };
        setShifts(updated);
        showToast(`Registrado hoy con ${predicted.name}`);
      };

      const handleAutofillMonthRotation = () => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const updated = { ...shifts };
        let addedCount = 0;

        for (let d = 1; d <= daysInMonth; d++) {
          const dateObj = new Date(year, month, d);
          const dayOfWeek = dateObj.getDay(); 
          
          if (dayOfWeek !== 0 && dayOfWeek !== 6) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            
            if (!updated[dateStr]) {
              const MathPredicted = getPredictedShiftForDate(dateObj);
              updated[dateStr] = {
                type: 'work',
                startTime: MathPredicted.startTime,
                endTime: MathPredicted.endTime,
                breakMinutes: MathPredicted.breakMinutes,
                teletrabajo: false,
                flexHours: 0,
                notes: `Auto-rellenado: ${MathPredicted.name}`
              };
              addedCount++;
            }
          }
        }

        setShifts(updated);
        showToast(`Se han auto-rellenado ${addedCount} días laborales con su turno correspondiente.`);
      };

      const handleExportToSheets = async () => {
        if (!googleSheetsUrl) {
          showToast('Por favor, configura la URL de tu Web App de Google en la pestaña Integración.');
          return;
        }

        setSyncLoading(true);
        try {
          const payload = Object.entries(shifts).map(([fecha, data]) => {
            const hours = data.type === 'work' ? calculateHours(data.startTime, data.endTime, data.breakMinutes) : 0;
            return {
              fecha,
              tipo: data.type,
              inicio: data.startTime || '',
              fin: data.endTime || '',
              descanso: data.breakMinutes || 0,
              teletrabajo: data.teletrabajo ? 'Sí' : 'No',
              flex: data.flexHours || 0,
              total_horas: hours,
              notes: data.notes || ''
            };
          });

          await fetch(googleSheetsUrl, {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              username: sheetUser,
              password: sheetPassword,
              shifts: payload 
            })
          });

          showToast('Petición enviada. Se validaron las credenciales y se actualizó Google Sheets.');
        } catch (error) {
          console.error(error);
          showToast('Error al conectar con el servidor de Google Sheets.');
        } finally {
          setSyncLoading(false);
        }
      };

      const handleResetAllData = () => {
        setShifts({});
        setShowResetConfirm(false);
        showToast('Se han eliminado todos los registros');
      };

      const renderCalendarDays = () => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDayIndex = (() => {
          const day = new Date(year, month, 1).getDay();
          return day === 0 ? 6 : day - 1;
        })();

        const days = [];
        
        for (let i = 0; i < firstDayIndex; i++) {
          days.push(<div key={`empty-${i}`} className="bg-slate-50 border border-slate-100 p-2 min-h-[110px] opacity-40"></div>);
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const dateObj = new Date(year, month, d);
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const dayData = shifts[dateStr];
          const predicted = getPredictedShiftForDate(dateObj);
          const dayOfWeek = dateObj.getDay();
          const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;

          const isToday = d === 19 && month === 4 && year === 2026;

          let dayBg = isWeekend ? "bg-slate-50/70" : "bg-white";
          let borderStyle = "border border-slate-200";
          let content = null;

          if (isToday) {
            borderStyle = "border-2 border-orange-500 ring-4 ring-orange-100 shadow-md";
          }

          if (dayData) {
            if (dayData.type === 'work') {
              dayBg = dayData.teletrabajo ? "bg-emerald-50/90 hover:bg-emerald-100" : "bg-orange-50/30 hover:bg-orange-100/40";
              const hours = calculateHours(dayData.startTime, dayData.endTime, dayData.breakMinutes);
              content = (
                <div className="mt-1.5 flex flex-col gap-1 text-left">
                  <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded-full w-max ${dayData.teletrabajo ? 'bg-emerald-200 text-emerald-800' : 'bg-orange-200 text-orange-900'}`}>
                    {dayData.teletrabajo ? '🏠 Teletrabajo' : '🏢 Presencial'}
                  </span>
                  <span className="text-xs text-slate-700 font-semibold">
                    🕒 {dayData.startTime} - {dayData.endTime}
                  </span>
                  <span className="text-[10px] text-slate-500 font-medium">
                    {hours}h {dayData.flexHours > 0 ? `(+${dayData.flexHours}h Flex)` : dayData.flexHours < 0 ? `(${dayData.flexHours}h Flex)` : ''}
                  </span>
                </div>
              );
            } else if (dayData.type === 'vacation') {
              dayBg = "bg-amber-50/90 hover:bg-amber-100";
              content = (
                <div className="mt-1.5 text-left">
                  <span className="text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-amber-200 text-amber-800 inline-block">
                    🌴 Vacaciones
                  </span>
                </div>
              );
            } else if (dayData.type === 'rest') {
              dayBg = "bg-purple-50/90 hover:bg-purple-100";
              content = (
                <div className="mt-1.5 text-left">
                  <span className="text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-purple-200 text-purple-800 inline-block">
                    ☕ Compensado / Libre
                  </span>
                </div>
              );
            } else if (dayData.type === 'holiday') {
              dayBg = "bg-rose-50 hover:bg-rose-100";
              content = (
                <div className="mt-1.5 text-left">
                  <span className="text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-rose-200 text-rose-800 inline-block">
                    🚩 Festivo
                  </span>
                </div>
              );
            } else if (dayData.type === 'compensatory') {
              dayBg = "bg-fuchsia-50 hover:bg-fuchsia-100";
              content = (
                <div className="mt-1.5 text-left">
                  <span className="text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-fuchsia-200 text-fuchsia-800 inline-block">
                    ⭐ Compensatorio
                  </span>
                </div>
              );
            }
          } else if (!isWeekend) {
            content = (
              <div className="mt-1.5 opacity-40 text-left group-hover:opacity-80 transition-opacity">
                <span className="text-[9px] text-slate-400 block font-bold">💡 Turno Sugerido:</span>
                <span className="text-xs text-slate-500 block font-medium">
                  {predicted.startTime} - {predicted.endTime}
                </span>
              </div>
            );
          }

          days.push(
            <div 
              key={dateStr} 
              onClick={() => handleOpenEdit(dateStr)}
              className={`p-2.5 min-h-[115px] ${dayBg} ${borderStyle} transition-all cursor-pointer relative flex flex-col justify-between group`}
            >
              <div className="w-full">
                <div className="flex justify-between items-center">
                  <span className={`text-sm font-bold ${isToday ? 'text-orange-600 bg-orange-50 px-2 py-0.5 rounded-full' : 'text-slate-700'}`}>
                    {d}
                  </span>
                  {isToday && <span className="text-[9px] text-orange-700 font-extrabold tracking-wider uppercase">HOY</span>}
                </div>
                {content}
              </div>
              
              {dayData && (
                <div className="flex justify-end gap-1 mt-1 opacity-0 group-hover:opacity-100 transition-opacity">
                  <button 
                    onClick={(e) => { e.stopPropagation(); handleDeleteDay(dateStr); }}
                    className="p-1 rounded text-red-400 hover:text-red-600 hover:bg-red-50 transition-colors"
                    title="Eliminar este día"
                  >
                    <TrashIcon />
                  </button>
                </div>
              )}
            </div>
          );
        }

        return days;
      };

      // ================= RENDERIZADO CONDICIONAL DE PANTALLA DE LOGIN =================
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col justify-center items-center p-4">
            {/* Toast en el Login */}
            {notification && (
              <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 animate-slideIn border border-slate-800">
                <div className="w-2.5 h-2.5 rounded-full bg-orange-500 animate-ping"></div>
                <span className="text-sm font-semibold">{notification}</span>
              </div>
            )}

            <div className="max-w-md w-full bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl overflow-hidden p-8 space-y-6 animate-scaleUp">
              <div className="flex flex-col items-center text-center space-y-3">
                <div className="p-4 bg-orange-600 rounded-2xl text-white shadow-xl shadow-orange-950/50">
                  <KeyIcon />
                </div>
                <div>
                  <h1 className="text-2xl font-black text-white">WorkFlow Pro</h1>
                  <p className="text-xs text-orange-500 font-extrabold tracking-widest uppercase mt-1">Portal de Acceso Orange</p>
                </div>
              </div>

              <form onSubmit={handleLoginSubmit} className="space-y-4 pt-4">
                {loginError && (
                  <div className="p-3 bg-red-900/30 border border-red-900 text-red-200 text-xs font-semibold rounded-xl text-center">
                    ⚠️ {loginError}
                  </div>
                )}

                <div className="space-y-1">
                  <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider">Usuario corporativo</label>
                  <input 
                    type="text"
                    required
                    value={loginUser}
                    onChange={(e) => setLoginUser(e.target.value)}
                    placeholder="Ej: admin"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:ring-2 focus:ring-orange-500 outline-none transition-all placeholder:text-slate-600"
                  />
                </div>

                <div className="space-y-1">
                  <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider">Contraseña</label>
                  <input 
                    type="password"
                    required
                    value={loginPass}
                    onChange={(e) => setLoginPass(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:ring-2 focus:ring-orange-500 outline-none transition-all placeholder:text-slate-600"
                  />
                </div>

                <button 
                  type="submit"
                  className="w-full py-3.5 bg-orange-600 hover:bg-orange-500 text-white font-black rounded-xl text-sm transition-all shadow-lg shadow-orange-950/30 cursor-pointer"
                >
                  Iniciar Sesión
                </button>
              </form>

              <div className="pt-2 flex flex-col gap-2">
                <button 
                  onClick={handleQuickDemoAccess}
                  className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-orange-400 font-bold rounded-xl text-xs transition-all border border-slate-700/60 cursor-pointer"
                >
                  ✨ Acceso de Demostración Rápido (Un Clic)
                </button>
              </div>

              <div className="pt-4 border-t border-slate-800/80 text-center">
                <p className="text-[10px] text-slate-500 font-medium">
                  🔑 Nota: Puedes modificar tu usuario y contraseña en tu base de datos de Google Sheets o dentro de los ajustes de integración de la app.
                </p>
              </div>
            </div>

            <footer className="mt-8 text-center text-xs text-slate-600 font-bold">
              <p>© 2026 WorkFlow Pro. Orange Corporate Authentication.</p>
            </footer>
          </div>
        );
      }

      // ================= APLICACIÓN PRINCIPAL (LOGGED IN) =================
      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col">
          {/* Notificación Toast */}
          {notification && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 animate-slideIn">
              <div className="w-2.5 h-2.5 rounded-full bg-orange-500 animate-ping"></div>
              <span className="text-sm font-semibold">{notification}</span>
            </div>
          )}

          {/* HEADER */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col lg:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <div className="p-3 bg-orange-600 rounded-2xl text-white shadow-lg shadow-orange-100">
                  <ClockIcon />
                </div>
                <div>
                  <h1 className="text-2xl font-black tracking-tight text-slate-900">WorkFlow Pro</h1>
                  <p className="text-xs text-slate-500 font-semibold flex items-center gap-1.5">
                    <span>Horarios Rotativos y Calendario Flex</span>
                    <span className="inline-block w-1.5 h-1.5 rounded-full bg-slate-300"></span>
                    <span className="text-orange-600 font-bold">
                      {currentDate.toLocaleString('es-ES', { month: 'long', year: 'numeric' })}
                    </span>
                  </p>
                </div>
              </div>

              {/* Menú de Navegación e Inicio/Cierre de Sesión */}
              <div className="flex flex-wrap lg:flex-nowrap items-center gap-3">
                <nav className="flex flex-wrap bg-slate-100 p-1.5 rounded-2xl border border-slate-200 gap-1">
                  <button 
                    onClick={() => setActiveTab('dashboard')}
                    className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all ${activeTab === 'dashboard' ? 'bg-white text-orange-600 shadow-sm' : 'text-slate-600 hover:text-slate-955'}`}
                  >
                    <ChartIcon /> Resumen
                  </button>
                  <button 
                    onClick={() => setActiveTab('calendar')}
                    className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all ${activeTab === 'calendar' ? 'bg-white text-orange-600 shadow-sm' : 'text-slate-600 hover:text-slate-955'}`}
                  >
                    <CalendarIcon /> Calendario
                  </button>
                  <button 
                    onClick={() => setActiveTab('stats')}
                    className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all ${activeTab === 'stats' ? 'bg-white text-orange-600 shadow-sm' : 'text-slate-600 hover:text-slate-955'}`}
                  >
                    <PalmTreeIcon /> Métricas & Balance
                  </button>
                  <button 
                    onClick={() => setActiveTab('integration')}
                    className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all ${activeTab === 'integration' ? 'bg-white text-orange-600 shadow-sm' : 'text-slate-600 hover:text-slate-955'}`}
                  >
                    <CloudIcon /> Integración
                  </button>
                  <button 
                    onClick={() => setActiveTab('settings')}
                    className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all ${activeTab === 'settings' ? 'bg-white text-orange-600 shadow-sm' : 'text-slate-600 hover:text-slate-955'}`}
                  >
                    <SettingsIcon /> Ajustes
                  </button>
                </nav>

                <button 
                  onClick={handleLogout}
                  className="flex items-center gap-2 px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-2xl text-xs sm:text-sm font-extrabold transition-all cursor-pointer shadow-sm shadow-slate-950/20"
                  title="Cerrar sesión segura"
                >
                  <LogoutIcon /> Salir
                </button>
              </div>
            </div>
          </header>

          {/* CONTENIDO */}
          <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
            
            {/* Selector de Mes / Año Global Rápido en cabecera del contenido */}
            <div className="mb-6 bg-white border border-slate-200 rounded-3xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
              <div className="flex items-center gap-2">
                <button 
                  onClick={handlePrevMonth}
                  className="p-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-orange-50 hover:text-orange-600 transition-colors shadow-xs"
                  title="Mes anterior"
                >
                  <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7" />
                  </svg>
                </button>
                
                {/* Selector Desplegable de Meses */}
                <select 
                  value={currentDate.getMonth()} 
                  onChange={handleMonthSelect}
                  className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-orange-500 outline-none cursor-pointer"
                >
                  {monthsList.map(m => (
                    <option key={m.value} value={m.value}>{m.label}</option>
                  ))}
                </select>

                {/* Selector Desplegable de Años (Historial de 15 Años) */}
                <select 
                  value={currentDate.getFullYear()} 
                  onChange={handleYearSelect}
                  className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-orange-500 outline-none cursor-pointer"
                >
                  {yearsList.map(y => (
                    <option key={y} value={y}>{y}</option>
                  ))}
                </select>

                <button 
                  onClick={handleNextMonth}
                  className="p-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-orange-50 hover:text-orange-600 transition-colors shadow-xs"
                  title="Mes siguiente"
                >
                  <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7" />
                  </svg>
                </button>
              </div>

              <div className="flex gap-2">
                <button 
                  onClick={handleGoToToday}
                  className="px-4 py-2 bg-orange-100 hover:bg-orange-200 text-orange-800 text-xs font-black rounded-xl transition-all shadow-xs"
                >
                  Regresar a Mayo 2026
                </button>
              </div>
            </div>

            {/* ================= TAB 1: DASHBOARD ================= */}
            {activeTab === 'dashboard' && (
              <div className="space-y-8 animate-fadeIn">
                
                {/* Información del Estado de Rotación y Hoy */}
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="lg:col-span-2 space-y-2">
                    <span className="px-3 py-1 bg-orange-100 text-orange-800 font-extrabold rounded-lg text-xs uppercase tracking-wide">
                      Rotación de Turnos Activa
                    </span>
                    <h3 className="text-xl font-bold text-slate-900">Estás en la semana 2 de tu Turno Mañana (08:00 - 16:00)</h3>
                    <p className="text-sm text-slate-500">
                      La semana que viene (desde el lunes 25 de mayo de 2026) pasarás automáticamente al **Turno de Tarde (09:00 - 18:00)** en tus predicciones del calendario.
                    </p>
                  </div>
                  <div className="bg-slate-50 p-4 rounded-2xl flex flex-col justify-between border border-slate-150">
                    <div className="flex justify-between items-start">
                      <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Hoy es Martes 19 de Mayo</span>
                      <span className="w-2.5 h-2.5 rounded-full bg-orange-600"></span>
                    </div>
                    <button 
                      onClick={() => handleQuickLogRotationToday(new Date(2026, 4, 19))}
                      className="mt-4 w-full py-2.5 px-4 bg-orange-600 hover:bg-orange-700 text-white font-bold rounded-xl text-xs transition-colors shadow-md shadow-orange-100"
                    >
                      Registrar Turno de Hoy Rápido
                    </button>
                  </div>
                </div>

                {/* Tarjetas de Métricas del periodo seleccionado */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                  
                  {/* Horas de trabajo */}
                  <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex items-center gap-5">
                    <div className="p-4 bg-orange-50 rounded-2xl text-orange-600">
                      <ClockIcon />
                    </div>
                    <div>
                      <p className="text-xs text-slate-400 font-bold uppercase tracking-wider">Horas Trabajadas</p>
                      <h4 className="text-2xl font-black text-slate-950 mt-1">{stats.totalWorkHours} hrs</h4>
                      <p className="text-xs text-slate-500 mt-1">Meta del mes: {targetHours}h</p>
                    </div>
                  </div>

                  {/* Días teletrabajados */}
                  <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex items-center gap-5">
                    <div className="p-4 bg-emerald-50 rounded-2xl text-emerald-600">
                      <HomeIcon />
                    </div>
                    <div>
                      <p className="text-xs text-slate-400 font-bold uppercase tracking-wider">Días Teletrabajo</p>
                      <h4 className="text-2xl font-black text-slate-950 mt-1">{stats.teleworkDays} días</h4>
                      <p className="text-xs text-slate-500 mt-1">{stats.workDaysCount > 0 ? `${Math.round((stats.teleworkDays / stats.workDaysCount) * 100)}% de tu jornada` : 'Sin registros'}</p>
                    </div>
                  </div>

                  {/* Días vacaciones */}
                  <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex items-center gap-5">
                    <div className="p-4 bg-amber-50 rounded-2xl text-amber-600">
                      <PalmTreeIcon />
                    </div>
                    <div>
                      <p className="text-xs text-slate-400 font-bold uppercase tracking-wider">Vacaciones / Libres</p>
                      <h4 className="text-2xl font-black text-slate-950 mt-1">{stats.vacationDays + stats.restDays} días</h4>
                      <p className="text-xs text-slate-500 mt-1">Disfrutados en este mes</p>
                    </div>
                  </div>

                  {/* Balance Plan Flex */}
                  <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex items-center gap-5">
                    <div className="p-4 bg-orange-50 rounded-2xl text-orange-600">
                      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                        <path strokeLinecap="round" strokeLinejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                      </svg>
                    </div>
                    <div>
                      <p className="text-xs text-slate-400 font-bold uppercase tracking-wider">Saldo Plan Flex</p>
                      <h4 className={`text-2xl font-black mt-1 ${stats.totalFlexBalance >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                        {stats.totalFlexBalance >= 0 ? `+${stats.totalFlexBalance}` : stats.totalFlexBalance} hrs
                      </h4>
                      <p className="text-xs text-slate-500 mt-1">Acumuladas para compensar</p>
                    </div>
                  </div>
                </div>

                {/* Listado de Últimos Turnos Registrados */}
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                  <div className="flex justify-between items-center mb-6">
                    <h3 className="text-lg font-bold text-slate-950">
                      Registros activos de {currentDate.toLocaleString('es-ES', { month: 'long', year: 'numeric' })}
                    </h3>
                    {googleSheetsUrl && (
                      <button 
                        onClick={handleExportToSheets}
                        disabled={syncLoading}
                        className="flex items-center gap-2 px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-xs font-bold transition-all disabled:opacity-50 shadow-sm shadow-orange-100"
                      >
                        <CloudIcon /> {syncLoading ? 'Sincronizando...' : 'Sincronizar a Google Sheets'}
                      </button>
                    )}
                  </div>

                  <div className="space-y-3">
                    {Object.entries(shifts)
                      .filter(([dateStr]) => {
                        const [y, m] = dateStr.split('-').map(Number);
                        return y === currentDate.getFullYear() && (m - 1) === currentDate.getMonth();
                      })
                      .sort((a, b) => b[0].localeCompare(a[0])) 
                      .map(([dateStr, data]) => {
                        const hours = data.type === 'work' ? calculateHours(data.startTime, data.endTime, data.breakMinutes) : 0;
                        return (
                          <div key={dateStr} className="p-4 rounded-2xl bg-slate-50 border border-slate-150 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:border-slate-300 transition-all">
                            <div className="flex items-start gap-3">
                              <span className="text-sm font-bold bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl">
                                {dateStr.split('-')[2]}
                              </span>
                              <div>
                                <p className="text-sm font-bold text-slate-900">{formatFriendlyDate(dateStr)}</p>
                                <p className="text-xs text-slate-500">{data.notes || 'Sin anotaciones'}</p>
                              </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                              {data.type === 'work' && (
                                <>
                                  <span className={`text-xs font-bold px-2.5 py-1 rounded-lg ${data.teletrabajo ? 'bg-emerald-100 text-emerald-800' : 'bg-orange-100 text-orange-900'}`}>
                                    {data.teletrabajo ? '🏠 Teletrabajo' : '🏢 Presencial'}
                                  </span>
                                  <span className="text-sm font-bold text-slate-700">
                                    🕒 {data.startTime} - {data.endTime} ({hours}h)
                                  </span>
                                  {data.flexHours !== 0 && (
                                    <span className={`text-xs font-bold px-2 py-0.5 rounded-md ${data.flexHours > 0 ? 'bg-amber-100 text-amber-700' : 'bg-red-50 text-red-700'}`}>
                                      {data.flexHours > 0 ? `+${data.flexHours}h` : `${data.flexHours}h`} Flex
                                    </span>
                                  )}
                                </>
                              )}
                              {data.type === 'vacation' && (
                                <span className="text-xs font-bold px-2.5 py-1 rounded-lg bg-amber-100 text-amber-800">
                                  🌴 Vacaciones
                                </span>
                              )}
                              {data.type === 'rest' && (
                                <span className="text-xs font-bold px-2.5 py-1 rounded-lg bg-purple-100 text-purple-800">
                                  ☕ Libre
                                </span>
                              )}
                              {data.type === 'holiday' && (
                                <span className="text-xs font-bold px-2.5 py-1 rounded-lg bg-rose-100 text-rose-800">
                                  🚩 Festivo
                                </span>
                              )}
                              {data.type === 'compensatory' && (
                                <span className="text-xs font-bold px-2.5 py-1 rounded-lg bg-fuchsia-100 text-fuchsia-800">
                                  ⭐ Compensatorio
                                </span>
                              )}
                              
                              <div className="flex gap-1 border-l pl-3 border-slate-200 ml-2">
                                <button 
                                  onClick={() => handleOpenEdit(dateStr)}
                                  className="p-1 rounded text-orange-600 hover:bg-orange-50 hover:text-orange-700"
                                >
                                  <SettingsIcon />
                                </button>
                                <button 
                                  onClick={() => handleDeleteDay(dateStr)}
                                  className="p-1 rounded text-red-400 hover:bg-red-50 hover:text-red-600"
                                >
                                  <TrashIcon />
                                </button>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                  </div>
                </div>
              </div>
            )}

            {/* ================= TAB 2: CALENDARIO ================= */}
            {activeTab === 'calendar' && (
              <div className="space-y-6 animate-fadeIn">
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                  <h2 className="text-xl font-black text-slate-900 capitalize">
                    Vista Mensual: {currentDate.toLocaleString('es-ES', { month: 'long', year: 'numeric' })}
                  </h2>
                  <button 
                    onClick={handleAutofillMonthRotation}
                    className="px-4 py-2.5 bg-orange-50 hover:bg-orange-100 text-orange-700 rounded-xl text-xs font-bold transition-all border border-orange-100"
                  >
                    ⚡ Auto-rellenar según mi rotación
                  </button>
                </div>

                <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                  <div className="grid grid-cols-7 border-b border-slate-200 bg-slate-50 py-3 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">
                    <div>Lun</div>
                    <div>Mar</div>
                    <div>Mié</div>
                    <div>Jue</div>
                    <div>Vie</div>
                    <div>Sáb</div>
                    <div>Dom</div>
                  </div>
                  <div className="grid grid-cols-7 auto-rows-fr">
                    {renderCalendarDays()}
                  </div>
                </div>

                <div className="bg-white p-4 rounded-2xl border border-slate-200 flex flex-wrap justify-center gap-5 text-xs font-semibold text-slate-600 shadow-sm">
                  <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-orange-200"></span><span>Trabajo Presencial</span></div>
                  <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-emerald-300"></span><span>Teletrabajo</span></div>
                  <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-amber-300"></span><span>Vacaciones</span></div>
                  <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-purple-300"></span><span>Libre / Descanso</span></div>
                  <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-rose-300"></span><span>Festivo</span></div>
                  <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-fuchsia-300"></span><span>Compensatorio</span></div>
                </div>
              </div>
            )}

            {/* ================= TAB 3: ESTADÍSTICAS ================= */}
            {activeTab === 'stats' && (
              <div className="space-y-8 animate-fadeIn">
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                  <h2 className="text-xl font-bold text-slate-900">Métricas y Balance de Jornada</h2>
                  <p className="text-sm text-slate-500">Información de cumplimiento sobre el mes de {currentDate.toLocaleString('es-ES', { month: 'long', year: 'numeric' })}.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div>
                      <h3 className="text-lg font-bold text-slate-900">Cumplimiento de Jornada</h3>
                      <p className="text-xs text-slate-400 mt-1">Horas de trabajo mensuales recomendadas</p>
                    </div>
                    <div className="my-8">
                      <div className="flex justify-between items-end mb-2">
                        <span className="text-sm font-semibold text-slate-500">Completado</span>
                        <span className="text-2xl font-black text-slate-900">{stats.totalWorkHours}h / {targetHours}h</span>
                      </div>
                      <div className="w-full bg-slate-100 h-4 rounded-full overflow-hidden">
                        <div className="bg-orange-600 h-full rounded-full transition-all duration-500" style={{ width: `${Math.min(100, (stats.totalWorkHours / targetHours) * 100)}%` }}></div>
                      </div>
                      <div className="flex justify-between mt-2">
                        <span className="text-xs text-slate-400">0%</span>
                        <span className="text-xs text-orange-600 font-bold">{Math.round((stats.totalWorkHours / targetHours) * 100)}% de la meta</span>
                        <span className="text-xs text-slate-400">100%</span>
                      </div>
                    </div>
                    <div className="bg-orange-50/50 p-4 rounded-2xl text-xs text-orange-950 font-medium border border-orange-100">
                      {stats.totalWorkHours >= targetHours ? '🎉 Excelente. Has cubierto las horas recomendadas.' : `⚠️ Faltan ${Math.max(0, targetHours - stats.totalWorkHours).toFixed(1)} horas.`}
                    </div>
                  </div>

                  <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div>
                      <h3 className="text-lg font-bold text-slate-900">Estado del Plan Flex</h3>
                      <p className="text-xs text-slate-400 mt-1">Saldo acumulado por horas de recuperación o compensadas</p>
                    </div>
                    <div className="my-6 text-center">
                      <span className={`text-5xl font-extrabold ${stats.totalFlexBalance >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                        {stats.totalFlexBalance >= 0 ? `+${stats.totalFlexBalance}` : stats.totalFlexBalance} hrs
                      </span>
                      <p className="text-sm text-slate-500 mt-2 font-medium">Saldo Flex Neto de este mes</p>
                    </div>
                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-xs text-slate-600 leading-relaxed font-medium">
                      💡 Reporta valores positivos cuando trabajes extra para compensar días de salida temprana.
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ================= TAB 4: INTEGRACIÓN ================= */}
            {activeTab === 'integration' && (
              <div className="max-w-4xl mx-auto space-y-8 animate-fadeIn">
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                  <div className="flex items-center gap-3">
                    <div className="p-2.5 bg-orange-50 rounded-xl text-orange-600">
                      <CloudIcon />
                    </div>
                    <h3 className="text-lg font-extrabold text-slate-900">Configurar Sincronización con Google Sheets</h3>
                  </div>
                  <p className="text-sm text-slate-500 leading-relaxed">
                    Configura la URL de tu Google Web App y tus credenciales de seguridad. Al sincronizar, la aplicación enviará este usuario y contraseña para validar el acceso contra tu pestaña de **Configuración** de Sheets.
                  </p>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">Usuario de Sheets y Aplicación (Local):</label>
                      <input 
                        type="text" 
                        value={sheetUser}
                        onChange={(e) => setSheetUser(e.target.value)}
                        placeholder="Ej: admin"
                        className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">Contraseña de Sheets y Aplicación (Local):</label>
                      <input 
                        type="password" 
                        value={sheetPassword}
                        onChange={(e) => setSheetPassword(e.target.value)}
                        placeholder="Ej: admin123"
                        className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none"
                      />
                    </div>
                  </div>

                  <div className="pt-2">
                    <label className="block text-xs font-bold text-slate-600 mb-1">URL de tu Web App de Google (Apps Script Deploy):</label>
                    <input 
                      type="url" 
                      value={googleSheetsUrl}
                      onChange={(e) => setGoogleSheetsUrl(e.target.value)}
                      placeholder="https://script.google.com/macros/s/XXXXXX/exec"
                      className="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500 outline-none"
                    />
                  </div>

                  {googleSheetsUrl && (
                    <button 
                      onClick={handleExportToSheets}
                      disabled={syncLoading}
                      className="px-5 py-2.5 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-xs font-bold transition-all disabled:opacity-50 shadow-md shadow-orange-100"
                    >
                      {syncLoading ? 'Sincronizando...' : 'Sincronizar y Exportar Ahora'}
                    </button>
                  )}
                </div>

                {/* Código de Apps Script */}
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                  <h4 className="text-sm font-bold text-slate-800 flex items-center gap-2">
                    <span>📄 Código de Google Apps Script</span>
                  </h4>
                  <p className="text-xs text-slate-500">
                    Sincroniza tus turnos de manera segura en tu Sheets. Asegúrate de tener las pestañas de <strong>Turnos</strong> y de <strong>Configuración</strong> en tu documento.
                  </p>

                  <pre className="bg-slate-900 text-slate-200 text-xs p-4 rounded-xl overflow-x-auto font-mono leading-relaxed max-h-[250px] overflow-y-auto">
{`function doPost(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  
  var configSheet = ss.getSheetByName("Configuración");
  if (!configSheet) {
    configSheet = ss.insertSheet("Configuración");
    configSheet.appendRow(["Propiedad", "Valor"]);
    configSheet.appendRow(["Usuario", "admin"]);
    configSheet.appendRow(["Contraseña", "admin123"]);
  }
  
  var configData = configSheet.getDataRange().getValues();
  var storedUser = "admin";
  var storedPass = "admin123";
  for (var i = 1; i < configData.length; i++) {
    if (configData[i][0] === "Usuario" && configData[i][1]) storedUser = configData[i][1];
    if (configData[i][0] === "Contraseña" && configData[i][1]) storedPass = configData[i][1];
  }
  
  var receivedUser = "";
  var receivedPass = "";
  var shifts = [];
  
  try {
    var data = JSON.parse(e.postData.contents);
    receivedUser = data.username || "";
    receivedPass = data.password || "";
    shifts = data.shifts || [];
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ "status": "error", "message": "No se pudo interpretar el envío de datos." }))
      .setMimeType(ContentService.MimeType.JSON);
  }
  
  if (receivedUser.toString().trim() !== storedUser.toString().trim() || receivedPass.toString().trim() !== storedPass.toString().trim()) {
    return ContentService.createTextOutput(JSON.stringify({ "status": "error", "message": "Acceso Denegado: Usuario o contraseña incorrectos en la pestaña Configuración." }))
      .setMimeType(ContentService.MimeType.JSON);
  }
  
  var shiftsSheet = ss.getSheetByName("Turnos");
  if (!shiftsSheet) {
    shiftsSheet = ss.insertSheet("Turnos");
  }
  
  shiftsSheet.clearContents();
  shiftsSheet.appendRow(["Fecha", "Tipo de Jornada", "Hora Inicio", "Hora Fin", "Minutos Descanso", "Teletrabajo", "Horas Flex", "Total Horas", "Notas"]);
  
  for (var j = 0; j < shifts.length; j++) {
    var item = shifts[j];
    shiftsSheet.appendRow([
      item.fecha,
      item.tipo,
      item.inicio,
      item.fin,
      item.descanso,
      item.teletrabajo,
      item.flex,
      item.total_horas,
      item.notes || ""
    ]);
  }
  
  try {
    var defaultSheet = ss.getSheetByName("Hoja 1") || ss.getSheetByName("Sheet1");
    if (defaultSheet && defaultSheet.getLastRow() === 0 && ss.getSheets().length > 1) {
      ss.deleteSheet(defaultSheet);
    }
  } catch (err) {}
  
  return ContentService.createTextOutput(JSON.stringify({ "status": "success", "message": "Turnos sincronizados correctamente." }))
    .setMimeType(ContentService.MimeType.JSON);
}`}
                  </pre>
                </div>
              </div>
            )}

            {/* ================= TAB 5: CONFIGURACIÓN / AJUSTES ================= */}
            {activeTab === 'settings' && (
              <div className="max-w-2xl mx-auto space-y-8 animate-fadeIn">
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                  <h3 className="text-lg font-extrabold text-slate-900">🎯 Objetivo mensual de horas ({currentDate.toLocaleString('es-ES', { month: 'long', year: 'numeric' })})</h3>
                  <p className="text-xs text-slate-500">Ajusta las horas objetivo recomendadas para este mes para calcular el porcentaje de cumplimiento.</p>
                  <input 
                    type="number" 
                    value={targetHours}
                    onChange={(e) => setTargetHours(Number(e.target.value))}
                    className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none"
                  />
                </div>

                <div className="bg-red-50 p-6 rounded-3xl border border-red-150 space-y-4">
                  <h3 className="text-lg font-extrabold text-red-900">⚠️ Zona de Peligro</h3>
                  <p className="text-xs text-red-700">Esto borrará de forma irreversible todo tu historial de turnos guardado en el navegador.</p>
                  <button 
                    type="button"
                    onClick={() => setShowResetConfirm(true)}
                    className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold shadow-md shadow-red-100"
                  >
                    Borrar todos los datos de turnos
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* MODAL DE EDICIÓN DE DÍA */}
          {isEditing && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl border border-slate-100 animate-scaleUp">
                <div className="p-6 bg-slate-50 border-b border-slate-150 flex justify-between items-center">
                  <div>
                    <h3 className="text-lg font-bold text-slate-900">Gestionar Día</h3>
                    <p className="text-xs text-orange-600 font-bold mt-1">{formatFriendlyDate(selectedDateStr)}</p>
                  </div>
                  <button onClick={() => setIsEditing(false)} className="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-700 transition-all">
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
                  </button>
                </div>

                <form onSubmit={handleSaveDay} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Tipo de jornada</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button type="button" onClick={() => setEditForm({ ...editForm, type: 'work' })} className={`py-2 px-3 rounded-xl text-xs font-bold border transition-all ${editForm.type === 'work' ? 'bg-orange-600 border-orange-600 text-white shadow-md' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>💼 Trabajo</button>
                      <button type="button" onClick={() => setEditForm({ ...editForm, type: 'vacation' })} className={`py-2 px-3 rounded-xl text-xs font-bold border transition-all ${editForm.type === 'vacation' ? 'bg-amber-600 border-amber-600 text-white shadow-md' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>🌴 Vacaciones</button>
                      <button type="button" onClick={() => setEditForm({ ...editForm, type: 'rest' })} className={`py-2 px-3 rounded-xl text-xs font-bold border transition-all ${editForm.type === 'rest' ? 'bg-purple-600 border-purple-600 text-white shadow-md' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>☕ Libre / Descanso</button>
                      <button type="button" onClick={() => setEditForm({ ...editForm, type: 'holiday' })} className={`py-2 px-3 rounded-xl text-xs font-bold border transition-all ${editForm.type === 'holiday' ? 'bg-rose-600 border-rose-600 text-white shadow-md' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>🚩 Festivo</button>
                      <button type="button" onClick={() => setEditForm({ ...editForm, type: 'compensatory' })} className={`py-2.5 px-3 rounded-xl text-xs font-bold border transition-all col-span-2 ${editForm.type === 'compensatory' ? 'bg-fuchsia-600 border-fuchsia-600 text-white shadow-md' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>⭐ Día Compensatorio</button>
                    </div>
                  </div>

                  {editForm.type === 'work' && (
                    <div className="space-y-4 p-4 bg-slate-50 rounded-2xl border border-slate-200/60 animate-fadeIn">
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-[10px] font-bold text-slate-500 mb-1">Entrada</label>
                          <input type="time" value={editForm.startTime} onChange={(e) => setEditForm({ ...editForm, startTime: e.target.value })} className="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs font-semibold focus:ring-2 focus:ring-orange-500 outline-none" />
                        </div>
                        <div>
                          <label className="block text-[10px] font-bold text-slate-500 mb-1">Salida</label>
                          <input type="time" value={editForm.endTime} onChange={(e) => setEditForm({ ...editForm, endTime: e.target.value })} className="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs font-semibold focus:ring-2 focus:ring-orange-500 outline-none" />
                        </div>
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-[10px] font-bold text-slate-500 mb-1">Descanso (Minutos)</label>
                          <input type="number" value={editForm.breakMinutes} onChange={(e) => setEditForm({ ...editForm, breakMinutes: Number(e.target.value) })} className="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs font-semibold focus:ring-2 focus:ring-orange-500 outline-none" />
                        </div>
                        <div>
                          <label className="block text-[10px] font-bold text-slate-500 mb-1">Flex (Horas +/-)</label>
                          <input type="number" value={editForm.flexHours} onChange={(e) => setEditForm({ ...editForm, flexHours: Number(e.target.value) })} placeholder="Ej: 1 o -1" className="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs font-semibold focus:ring-2 focus:ring-orange-500 outline-none" />
                        </div>
                      </div>
                      <label className="flex items-center gap-3 bg-white p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition-colors">
                        <input type="checkbox" checked={editForm.teletrabajo} onChange={(e) => setEditForm({ ...editForm, teletrabajo: e.target.checked })} className="rounded border-slate-300 text-orange-600 focus:ring-orange-500 w-4 h-4" />
                        <div>
                          <p className="text-xs font-bold text-slate-800">¿Es Teletrabajo?</p>
                          <p className="text-[10px] text-slate-400">Marca esta casilla para trabajar desde casa.</p>
                        </div>
                      </label>
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Notas / Comentarios</label>
                    <textarea value={editForm.notes} onChange={(e) => setEditForm({ ...editForm, notes: e.target.value })} placeholder="Ej: Horas extras recuperadas, médico, etc." rows={2} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-orange-500 outline-none resize-none" />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => handleDeleteDay(selectedDateStr)} className="px-4 py-2.5 bg-red-50 text-red-600 hover:bg-red-100 rounded-xl text-xs font-bold flex-1 transition-colors">Eliminar</button>
                    <button type="submit" className="px-4 py-2.5 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-xs font-bold flex-1 transition-colors shadow-md shadow-orange-100">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CUSTOM CONFIRM MODAL PARA EVITAR ALERT() NATIVOS */}
          {showResetConfirm && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl border border-slate-100 animate-scaleUp">
                <h3 className="text-lg font-extrabold text-slate-900">¿Estás seguro?</h3>
                <p className="text-sm text-slate-500">Esta acción borrará de manera definitiva todos los turnos del calendario registrados en este navegador.</p>
                <div className="flex gap-3 pt-2">
                  <button onClick={() => setShowResetConfirm(false)} className="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold flex-1">Cancelar</button>
                  <button onClick={handleResetAllData} className="px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold flex-1 shadow-md shadow-red-100">Confirmar borrado</button>
                </div>
              </div>
            </div>
          )}

          <footer className="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-400 font-bold">
            <p>© 2026 WorkFlow Pro. Todos tus turnos perfectamente organizados.</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
